<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة تاسك جديد</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; padding: 12px; background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <h3>📝 إضافة بيانات التاسك</h3>
  <form id="taskForm">
    <div class="form-group"><label>Sales Name:</label><input type="text" id="sales_name" required></div>
    <div class="form-group"><label>Client Name:</label><input type="text" id="client_name" required></div>
    <div class="form-group"><label>Project Name:</label><input type="text" id="project_name" required></div>
    <div class="form-group"><label>Visit Number:</label><input type="number" id="visit_number" required></div>
    <div class="form-group"><label>Reason for Visit:</label><input type="text" id="reason" required></div>
    <div class="form-group"><label>Channel & Name:</label><input type="text" id="channel" required></div>
    <div class="form-group"><label>Action:</label><input type="text" id="action" required></div>
    
    <button type="submit">إرسال التاسك ✅</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); 
    
    const N8N_WEBHOOK_URL = 'https://botelegram.app.n8n.cloud/webhook-test/add-task';

    document.getElementById('taskForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const payload = {
        chat_id: tg.initDataUnsafe?.user?.id,
        sales_name: document.getElementById('sales_name').value,
        client_name: document.getElementById('client_name').value,
        project_name: document.getElementById('project_name').value,
        visit_number: document.getElementById('visit_number').value,
        reason: document.getElementById('reason').value,
        channel: document.getElementById('channel').value,
        action: document.getElementById('action').value
      };

      await fetch(N8N_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      tg.sendData(JSON.stringify(payload));
      tg.close();
    });
  </script>
</body>
</html>
