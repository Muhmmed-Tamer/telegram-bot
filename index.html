<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إضافة تاسك جديد</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --hint-color: var(--tg-theme-hint-color, #999999);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h3 {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 700;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: var(--hint-color);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-color);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      background-color: var(--secondary-bg-color);
      color: var(--text-color);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--button-color);
      box-shadow: 0 0 0 2px rgba(36, 129, 204, 0.2);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--button-text-color);
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="header">
    <h3>📝 إضافة بيانات التاسك</h3>
    <p>يرجى ملء الحقول التالية لإضافة التاسك للجداول</p>
  </div>

  <form id="taskForm" autocomplete="off">
    <div class="form-group">
      <label for="SalesName">Sales Name</label>
      <input type="text" id="SalesName" placeholder="أدخل اسم المبيعات" required>
    </div>
    
    <div class="form-group">
      <label for="ClientName">Client Name</label>
      <input type="text" id="ClientName" placeholder="أدخل اسم العميل" required>
    </div>
    
    <div class="form-group">
      <label for="ProjectName">Project Name</label>
      <input type="text" id="ProjectName" placeholder="اسم المشروع" required>
    </div>
    
    <div class="form-group">
      <label for="VisitNumber">Visit Number</label>
      <input type="number" id="VisitNumber" placeholder="رقم الزيارة" required>
    </div>
    
    <div class="form-group">
      <label for="ReasonForVisit">Reason For Visit</label>
      <input type="text" id="ReasonForVisit" placeholder="سبب الزيارة" required>
    </div>
    
    <div class="form-group">
      <label for="Channel">Channel</label>
      <input type="text" id="Channel" placeholder="القناة" required>
    </div>

    <div class="form-group">
      <label for="Name">Name</label>
      <input type="text" id="Name" placeholder="الاسم" required>
    </div>
    
    <div class="form-group">
      <label for="Action">Action</label>
      <input type="text" id="Action" placeholder="الإجراء المطلوب" required>
    </div>

    <button type="submit" id="submitBtn">
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">إرسال التاسك ✅</span>
    </button>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      const N8N_WEBHOOK_URL = 'https://botelegram.app.n8n.cloud/webhook/add-task';

      const form = document.getElementById('taskForm');
      const submitBtn = document.getElementById('submitBtn');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        // Lock UI
        submitBtn.disabled = true;
        btnSpinner.style.display = 'inline-block';
        btnText.innerText = 'جاري الإرسال...';

        const payload = {
          chat_id: tg?.initDataUnsafe?.user?.id || null,
          SalesName: document.getElementById('SalesName').value.trim(),
          ClientName: document.getElementById('ClientName').value.trim(), 
          ProjectName: document.getElementById('ProjectName').value.trim(),
          VisitNumber: document.getElementById('VisitNumber').value.trim(),
          ReasonForVisit: document.getElementById('ReasonForVisit').value.trim(),
          Channel: document.getElementById('Channel').value.trim(),
          Name: document.getElementById('Name').value.trim(),
          Action: document.getElementById('Action').value.trim()
        };

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); // 10s timeout safety

        try {
          const response = await fetch(N8N_WEBHOOK_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload),
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          if (!response.ok) {
            throw new Error(`Server returned status code ${response.status}`);
          }

          // Success feedback
          tg?.HapticFeedback?.notificationOccurred('success');
          
          if (tg) {
            tg.close();
          } else {
            alert('تم الإرسال بنجاح!');
            form.reset();
            submitBtn.disabled = false;
            btnSpinner.style.display = 'none';
            btnText.innerText = 'إرسال التاسك ✅';
          }

        } catch (err) {
          clearTimeout(timeoutId);
          console.error('Submission error:', err);

          tg?.HapticFeedback?.notificationOccurred('error');
          alert('حدث خطأ أثناء الإرسال! يرجى التأكد من الاتصال والمحاولة مرة أخرى.');

          // Unlock UI
          submitBtn.disabled = false;
          btnSpinner.style.display = 'none';
          btnText.innerText = 'إرسال التاسك ✅';
        }
      });
    });
  </script>
</body>
</html>
