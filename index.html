<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إضافة مهمة جديدة</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f4f7);
      --text-color: var(--tg-theme-text-color, #1c1c1e);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #ffffff);
      --border-color: rgba(0, 0, 0, 0.08);
      --accent-soft: rgba(36, 129, 204, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px 14px 40px 14px;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.4;
    }

    
    .top-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .top-action-bar h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    
    .header {
      background: var(--secondary-bg-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .header-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-soft);
      color: var(--button-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px auto;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: var(--hint-color);
    }

    
    .form-card {
      background: var(--secondary-bg-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--button-color);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-color);
    }

    input {
      width: 100%;
      padding: 11px 12px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--button-color);
      background-color: var(--secondary-bg-color);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input::placeholder {
      color: var(--hint-color);
      opacity: 0.7;
    }

    
    .submit-btn {
      padding: 12px 18px;
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .submit-btn.full-width {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      margin-top: 8px;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <form id="taskForm" autocomplete="off">

    
    <div class="top-action-bar">
      <h3>📝 إضافة تاسك</h3>
      <button type="submit" class="submit-btn top-submit-btn">
        <span>إرسال ✅</span>
      </button>
    </div>

    
    <div class="header">
      <div class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </div>
      <p>يرجى ملء البيانات التالية لحفظ التاسك تلقائياً</p>
    </div>

    
    <div class="form-card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        الأطراف الرئيسية
      </div>
      
      <div class="form-group">
        <label for="SalesName">مسؤول المبيعات (Sales)</label>
        <input type="text" id="SalesName" placeholder="أدخل اسم المبيعات" required>
      </div>

      <div class="form-group">
        <label for="ClientName">اسم العميل (Client)</label>
        <input type="text" id="ClientName" placeholder="أدخل اسم العميل" required>
      </div>

      <div class="form-group">
        <label for="ProjectName">اسم المشروع (Project)</label>
        <input type="text" id="ProjectName" placeholder="اسم المشروع" required>
      </div>
    </div>

    
    <div class="form-card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        تفاصيل الاتصال والزيارة
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="VisitNumber">رقم الزيارة</label>
          <input type="number" id="VisitNumber" placeholder="1" required>
        </div>

        <div class="form-group">
          <label for="Channel">القناة (Channel)</label>
          <input type="text" id="Channel" placeholder="واتساب / زيارة" required>
        </div>
      </div>

      <div class="form-group" style="margin-top: 10px;">
        <label for="ReasonForVisit">سبب الزيارة</label>
        <input type="text" id="ReasonForVisit" placeholder="سبب الزيارة" required>
      </div>
    </div>

    
    <div class="form-card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        المتابعة والإجراء المطلوب
      </div>

      <div class="form-group">
        <label for="Name">الاسم</label>
        <input type="text" id="Name" placeholder="الاسم" required>
      </div>

      <div class="form-group">
        <label for="Action">الإجراء المطلوب (Action)</label>
        <input type="text" id="Action" placeholder="الإجراء المطلوب" required>
      </div>
    </div>

    
    <button type="submit" class="submit-btn full-width bottom-submit-btn">
      <span>إرسال التاسك ✅</span>
    </button>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tg = window.Telegram?.WebApp;
      const N8N_WEBHOOK_URL = 'https://botelegram.app.n8n.cloud/webhook/add-task';

      const form = document.getElementById('taskForm');
      const submitBtns = document.querySelectorAll('.submit-btn');

      if (tg) {
        tg.ready();
        tg.expand();

        
        try {
          tg.MainButton.setText('إرسال التاسك ✅');
          tg.MainButton.show();
          tg.MainButton.onClick(() => form.requestSubmit());
        } catch(e){}
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        
        submitBtns.forEach(btn => {
          btn.disabled = true;
          btn.innerText = 'جاري الإرسال...';
        });

        if (tg?.MainButton?.isVisible) {
          tg.MainButton.showProgress();
          tg.MainButton.disable();
        }

        const payload = {
          chat_id: tg?.initDataUnsafe?.user?.id || null,
          SalesName: document.getElementById('SalesName').value.trim(),
          ClientName: document.getElementById('ClientName').value.trim(), 
          ProjectName: document.getElementById('ProjectName').value.trim(),
          VisitNumber: document.getElementById('VisitNumber').value.trim(),
          ReasonForVisit: document.getElementById('ReasonForVisit').value.trim(),
          Channel: document.getElementById('Channel').value.trim(),
          Name: document.getElementById('Name').value.trim(),
          Action: document.getElementById('Action').value.trim()
        };

        try {
          const res = await fetch(N8N_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: true
          });

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }

          tg?.HapticFeedback?.notificationOccurred('success');

          
          submitBtns.forEach(btn => {
            btn.innerText = 'تم الإرسال بنجاح! 🎉';
            btn.style.backgroundColor = '#2ecc71';
          });

          if (tg?.MainButton?.isVisible) {
            tg.MainButton.hideProgress();
            tg.MainButton.setText('تم الإرسال بنجاح! 🎉');
            tg.MainButton.setParams({ color: '#2ecc71' });
          }

          setTimeout(() => {
            if (tg) {
              tg.close();
            } else {
              form.reset();
              submitBtns.forEach(btn => {
                btn.disabled = false;
                btn.style.backgroundColor = '';
                btn.innerText = 'إرسال التاسك ✅';
              });
            }
          }, 800);

        } catch (error) {
          console.error('Submission Error:', error);
          tg?.HapticFeedback?.notificationOccurred('error');
          alert('حدث خطأ أثناء الإرسال! يرجى التأكد من تشغيل الـ Workflow في n8n.');

          
          submitBtns.forEach(btn => {
            btn.disabled = false;
            btn.style.backgroundColor = '';
            btn.innerText = 'إرسال التاسك ✅';
          });

          if (tg?.MainButton?.isVisible) {
            tg.MainButton.hideProgress();
            tg.MainButton.enable();
            tg.MainButton.setText('إعادة المحاولة 🔄');
          }
        }
      });
    });
  </script>
</body>
</html>
